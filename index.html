<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Inter:wght@300&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f13;--card:#15171b;--line:#22252b;--fg:#e8e6df;--mut:#5b6070;--acc:#c8f560;--ink:#0d0f13;--trk:#1f2227;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'DM Sans',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
#home{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:24px 0}
main{width:min(100%,520px);margin:0 auto;padding:0 clamp(20px,6vw,32px)}
.brand{text-align:center;font-weight:300;font-size:clamp(28px,8.4vw,46px);letter-spacing:.3em;margin-right:-.3em;text-transform:uppercase}
.today{text-align:center;color:var(--acc);font-size:clamp(16px,4.2vw,19px);margin:10px 0 clamp(36px,9vh,64px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:76px;padding:0 clamp(18px,5vw,30px);border-top:1px solid var(--line);font-size:clamp(16px,4.3vw,19px)}
.row.first{border-top:0}
.reveal{max-height:0;overflow:hidden;opacity:0;transform:translateY(-6px);border-top:1px solid transparent;transition:max-height 720ms cubic-bezier(.22,1,.36,1),opacity 520ms ease,transform 720ms cubic-bezier(.22,1,.36,1),border-color 720ms ease}
.reveal.is-open{max-height:100px;opacity:1;transform:none;border-top-color:var(--line)}
.reveal .row{border-top:0}
.step{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:18px;height:56px;flex:none}
.step:focus-within{border-color:var(--mut)}
.step button{background:none;border:0;color:var(--mut);font-size:24px;width:48px;height:100%;touch-action:manipulation}
.step input{width:3.4ch;text-align:center;background:none;border:0;outline:0;color:var(--fg);font:400 22px 'JetBrains Mono',monospace;padding:0;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.sw{position:relative;width:66px;height:40px;border-radius:20px;border:0;background:var(--trk);flex:none;transition:background 360ms ease}
.sw::after{content:"";position:absolute;top:5px;left:5px;width:30px;height:30px;border-radius:50%;background:#fff;transition:transform 360ms cubic-bezier(.22,1,.36,1)}
.sw[aria-checked=true]{background:var(--acc)}
.sw[aria-checked=true]::after{transform:translateX(26px)}
.go{display:block;width:100%;height:clamp(64px,10vh,78px);margin-top:clamp(20px,4vh,30px);border:0;border-radius:999px;background:var(--acc);color:var(--ink);font-weight:500;font-size:clamp(14px,3.8vw,18px);letter-spacing:.2em;text-transform:uppercase}
#imm{position:fixed;inset:0;width:100vw;height:100dvh;min-height:100svh;z-index:5;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#imm.on{display:flex}
.lab{margin:0 0 clamp(12px,3vh,28px);font-size:clamp(12px,3.4vw,17px);letter-spacing:.3em;margin-right:-.3em;color:var(--mut);text-transform:uppercase}
.lab b{font-weight:400;color:var(--acc)}
.time,.big{font-family:'Inter','DM Sans',system-ui,sans-serif}
.time{font-weight:300;font-size:clamp(64px,min(26vw,34vh),300px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.time.lg{font-size:clamp(40px,min(14vw,24vh),200px)}
@media (orientation:landscape){.time{font-size:min(29vw,60vh)}.time.lg{font-size:min(15vw,40vh)}}
.co{font-style:normal}
.paused .co{animation:bl 1.4s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.12}}
.time.sm{font-size:clamp(48px,min(16vw,22vh),160px)}
.big{font-weight:300;font-size:clamp(96px,min(40vw,45vh),360px);line-height:1;font-variant-numeric:tabular-nums}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 32px);margin:0;color:var(--mut);font-size:14px;padding:0 24px}
.q{margin:0;font-size:clamp(22px,6vw,34px);font-weight:300}
.cnt{font:400 clamp(40px,12vw,64px) 'JetBrains Mono',monospace;color:var(--mut);margin:24px 0 8px}
.ctl{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;justify-content:center;align-items:center;gap:20px;flex-wrap:wrap;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 420ms ease,visibility 0s linear 420ms}
#imm.show .ctl,.ctl.keep{opacity:1;visibility:visible;pointer-events:auto;transition:opacity 420ms ease,visibility 0s}
.ctl button:not(.pill){background:none;border:0;color:var(--mut);opacity:.8;font-size:15px;min-height:48px;padding:0 16px}
.pill{border:0;border-radius:999px;background:var(--acc);color:var(--ink);font-weight:500;font-size:16px;height:56px;padding:0 36px;margin-top:20px}
.ctl .pill{margin-top:0}
.sub{color:var(--mut);margin:12px 0 0;font-size:15px;padding:0 24px}
.duo{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:28px}
.duo .pill{margin-top:0}
.sub.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:0;right:0;margin:0}
[hidden]{display:none!important}
#home,#rep{position:relative}
.nav{position:absolute;top:14px;left:clamp(20px,6vw,32px);display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;min-height:44px;color:var(--mut);font-size:15px;letter-spacing:.03em;transition:color 300ms ease}
.nav:hover{color:var(--fg)}
.row.cat{padding:0 clamp(14px,4vw,22px)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.seg button{position:relative;height:64px;padding:0 0 12px;border:0;background:none;color:var(--mut);font-size:clamp(15px,4vw,17px);letter-spacing:.02em;transition:color 420ms ease}
.seg button[aria-pressed=true]{color:var(--fg)}
.seg button::after{content:"";position:absolute;left:50%;bottom:14px;width:22px;height:2px;margin-left:-11px;border-radius:2px;background:var(--line);transition:background 420ms ease,box-shadow 420ms ease}
.seg button[aria-pressed=true]::after{background:var(--acc);box-shadow:0 0 6px 1px rgba(200,245,96,.7),0 0 18px 4px rgba(200,245,96,.25)}
button.today{display:block;width:100%;background:none;border:0;padding:8px 0;margin:2px 0 calc(clamp(36px,9vh,64px) - 8px);transition:opacity 200ms ease}
button.today:active{opacity:.6}
.pulse{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 70px 6px rgba(200,245,96,.42),inset 0 0 200px 30px rgba(200,245,96,.2);animation:pl 2.2s ease-in-out infinite alternate}
@keyframes pl{from{opacity:.2}to{opacity:1}}
.fl{animation:fl 1100ms ease}
@keyframes fl{0%{opacity:.25}100%{opacity:1}}
.ml.sec{background:none;border:0;padding:12px 24px 4px 0;margin:-12px 0 -4px;text-align:left;font-size:14px}
#add{position:fixed;inset:0;z-index:6;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,6,8,.62);opacity:0;visibility:hidden;transition:opacity 320ms ease,visibility 0s linear 320ms}
#add.on{opacity:1;visibility:visible;transition:opacity 320ms ease,visibility 0s}
.sheet{width:min(100%,520px);background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:26px clamp(20px,6vw,32px) calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(24px);transition:transform 520ms cubic-bezier(.22,1,.36,1)}
#add.on .sheet{transform:none}
.sheet:focus{outline:0}
.sheet h2{margin:0;font-weight:400;font-size:19px}
.sheet .sd{margin:4px 0 0;color:var(--mut);font-size:14px;text-transform:capitalize}
.sheet .row{padding:0;min-height:80px;border-top:0}
.sheet .seg{border-top:1px solid var(--line)}
.sheet .go{margin-top:12px;height:64px}
.plain{display:block;width:100%;min-height:52px;margin-top:4px;background:none;border:0;color:var(--mut);font-size:15px}
.blk .rm{flex:none;min-width:40px;height:40px;margin-right:-10px;background:none;border:0;color:var(--mut);font-size:20px;line-height:1;opacity:.7}
.blk .rm.arm{font-size:13px;color:var(--fg);opacity:1;padding:0 10px}
#rep{min-height:100%;padding-bottom:56px}
#rep main{padding-top:68px}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.daynav button{width:48px;height:48px;border:0;background:none;color:var(--mut);font-size:26px}
.daynav button:disabled{opacity:.25;cursor:default}
#d-title{font-size:clamp(17px,4.6vw,20px);text-transform:capitalize}
#rep .card+.card{margin-top:16px}
.ml{display:block;color:var(--mut);font-size:14px}
.mv{display:block;margin-top:6px;font:400 clamp(22px,6.4vw,28px) 'JetBrains Mono',monospace}
.mv.xl{font-size:clamp(36px,11vw,52px);margin-top:8px}
.mrow,.mc,.dbox{padding:20px clamp(18px,5vw,30px)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.mc+.mc{border-left:1px solid var(--line)}
.ms{display:block;margin-top:4px;color:var(--mut);font-size:13px}
.bar{display:flex;gap:2px;height:10px;margin:16px 0 8px;border-radius:5px;overflow:hidden;background:var(--bg)}
.bar i{display:block;height:100%}
.lst{list-style:none;margin:6px 0 0;padding:0}
.lst li{display:flex;align-items:center;gap:10px;min-height:46px;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.lst .n{flex:1;min-width:0}
.lst .t{font:400 14px 'JetBrains Mono',monospace;text-align:right}
.lst .p{width:42px;text-align:right;color:var(--mut);font-size:13px}
.blk li{min-height:56px}
.blk li+li{border-top:1px solid var(--line)}
.blk .tm{width:46px;color:var(--mut);font:400 14px 'JetBrains Mono',monospace}
.blk em{display:block;font:normal 12px 'DM Sans',sans-serif;color:var(--mut)}
.lst .empty{color:var(--mut)}
.ghost{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;height:56px;padding:0 28px;font-size:16px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="home">
<button type="button" class="nav" id="open-rep" aria-label="Relatório do dia"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 11V7M7 11V3M11 11V8"/></svg>Relatório</button>
<main>
<div class="brand">Hiperfoco</div>
<button type="button" class="today" id="today" aria-label="Hoje: 0min de foco. Adicionar tempo manualmente">Hoje: 0min de foco</button>
<div class="card">
<div class="row first"><label for="v-focus">Duração do foco (min)</label><div class="step" data-k="focus" data-l="duração do foco"></div></div>
<div class="row"><span id="l-brk">Intervalos</span><button type="button" class="sw" role="switch" aria-checked="false" aria-labelledby="l-brk" data-sw="brk"></button></div>
<div class="reveal" id="r-brk"><div class="row"><label for="v-brkMin">Duração do intervalo (min)</label><div class="step" data-k="brkMin" data-l="duração do intervalo"></div></div></div>
<div class="row"><span id="l-chk">Voltar ao foco</span><button type="button" class="sw" role="switch" aria-checked="false" aria-labelledby="l-chk" data-sw="chk"></button></div>
<div class="reveal" id="r-chk"><div class="row"><label for="v-chkMin">Checagem a cada (min)</label><div class="step" data-k="chkMin" data-l="checagem"></div></div></div>
<div class="row cat"><div class="seg" role="group" aria-label="Categoria do bloco"><button type="button" aria-pressed="true" aria-label="Vendas" data-cat="v">Vendas</button><button type="button" aria-pressed="false" aria-label="Gestão e desenvolvimento" data-cat="g">Gestão</button><button type="button" aria-pressed="false" aria-label="Atividade livre" data-cat="l">Livre</button></div></div>
</div>
<button type="button" class="go" id="go">Iniciar hiperfoco</button>
</main>
</div>
<div id="rep" hidden>
<button type="button" class="nav" id="rep-back">‹ Voltar</button>
<main>
<div class="daynav"><button type="button" id="d-prev" aria-label="Dia anterior">‹</button><span id="d-title" aria-live="polite">Hoje</span><button type="button" id="d-next" aria-label="Próximo dia">›</button></div>
<div class="card">
<div class="mrow"><button type="button" class="ml sec" id="rep-add" aria-label="Tempo de foco. Adicionar tempo manualmente">Tempo de foco</button><span class="mv xl" id="m-foco">0min</span></div>
<div class="mgrid"><div class="mc"><span class="ml">Blocos</span><span class="mv" id="m-blocos">0</span></div><div class="mc"><span class="ml">Média por bloco</span><span class="mv" id="m-media">—</span><span class="ms" id="m-plan"></span></div></div>
</div>
<div class="card"><div class="dbox"><span class="ml">Distribuição do tempo</span><div class="bar" id="bar" role="img"></div><ul class="lst" id="dl"></ul></div></div>
<div class="card"><div class="dbox"><span class="ml">Blocos do dia</span><ul class="lst blk" id="bl"></ul></div></div>
</main>
</div>
<div id="add" aria-hidden="true">
<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="add-t" tabindex="-1">
<h2 id="add-t">Adicionar tempo de foco</h2>
<p class="sd" id="add-d">Hoje</p>
<div class="row first"><label for="v-mm">Tempo (min)</label><div class="step" data-k="mm" data-l="tempo de foco" data-st="5"></div></div>
<div class="seg" role="group" aria-label="Categoria do tempo"><button type="button" aria-pressed="true" aria-label="Vendas" data-mcat="v">Vendas</button><button type="button" aria-pressed="false" aria-label="Gestão e desenvolvimento" data-mcat="g">Gestão</button><button type="button" aria-pressed="false" aria-label="Atividade livre" data-mcat="l">Livre</button></div>
<button type="button" class="go" id="add-ok">Adicionar</button>
<button type="button" class="plain" id="add-x">Cancelar</button>
</div>
</div>
<div id="imm" aria-live="off"></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const cfg=Object.assign({focus:30,brk:false,brkMin:5,chk:false,chkMin:10,cat:'v'},ls.get('hf_cfg',{}));
const man={mm:30,cat:cfg.cat};
const T=k=>k==='mm'?man:cfg;
const LIM={focus:[1,240],brkMin:[1,60],chkMin:[1,60],mm:[1,720]};
const dkey=()=>new Date().toLocaleDateString('sv');
const fmt=s=>{const m=Math.floor(s/60),h=Math.floor(m/60),r=m%60;return h?(r?h+'h '+r+'min':h+'h'):m+'min'};
const p2=n=>String(n).padStart(2,'0');
const clk=ms=>{const t=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?h+':'+p2(m)+':'+p2(s):p2(m)+':'+p2(s)};
const today=()=>(ls.get('hf_days',{})[dkey()]||0);
const addDay=(sec,rec,key=dkey())=>{const d=ls.get('hf_days',{});d[key]=(d[key]||0)+sec;ls.set('hf_days',d);const a=ls.get('hf_sess',[]);a.push(rec);ls.set('hf_sess',a.slice(-1000))};

/* configurações */
const render=()=>{
  for(const k in LIM){const i=$('#v-'+k);if(i&&document.activeElement!==i)i.value=T(k)[k]}
  document.querySelectorAll('[data-sw]').forEach(b=>{const k=b.dataset.sw,on=!!cfg[k],r=$('#r-'+k);b.setAttribute('aria-checked',on);r.classList.toggle('is-open',on);r.inert=!on});
  document.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cat===cfg.cat));
  document.querySelectorAll('[data-mcat]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mcat===man.cat));
  const tt='Hoje: '+fmt(today())+' de foco',td=$('#today');td.textContent=tt;td.setAttribute('aria-label',tt+'. Adicionar tempo manualmente');
};
const nudge=(k,d)=>{const o=T(k);o[k]=Math.min(LIM[k][1],Math.max(LIM[k][0],o[k]+d));if(o===cfg)ls.set('hf_cfg',cfg);render()};
document.querySelectorAll('.step').forEach(el=>{
  const k=el.dataset.k,l=el.dataset.l,st=+el.dataset.st||1;
  el.innerHTML='<button type="button" data-d="-'+st+'" aria-label="Diminuir '+l+'">\u2212</button><input id="v-'+k+'" inputmode="numeric" autocomplete="off" aria-label="'+l+' em minutos"><button type="button" data-d="'+st+'" aria-label="Aumentar '+l+'">+</button>';
  el.querySelector('input').addEventListener('change',e=>{const o=T(k),v=parseInt(e.target.value,10);if(!isNaN(v)){o[k]=Math.min(LIM[k][1],Math.max(LIM[k][0],v));if(o===cfg)ls.set('hf_cfg',cfg)}e.target.value=o[k];render()});
});
let hold,rep,skip=false;
const stop=()=>{clearTimeout(hold);clearInterval(rep)};
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.step button');if(!b)return;const k=b.parentElement.dataset.k,d=+b.dataset.d;skip=true;setTimeout(()=>skip=false,700);nudge(k,d);hold=setTimeout(()=>{rep=setInterval(()=>nudge(k,d),130)},450)});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,stop));
addEventListener('blur',stop);
document.addEventListener('click',e=>{
  const b=e.target.closest('.step button');
  if(b){if(skip){skip=false;return}nudge(b.parentElement.dataset.k,+b.dataset.d);return}
  const mc=e.target.closest('[data-mcat]');
  if(mc){man.cat=mc.dataset.mcat;render();return}
  const ct=e.target.closest('[data-cat]');
  if(ct){cfg.cat=ct.dataset.cat;ls.set('hf_cfg',cfg);render();return}
  const s=e.target.closest('[data-sw]');
  if(s){cfg[s.dataset.sw]=!cfg[s.dataset.sw];ls.set('hf_cfg',cfg);render()}
});

/* tela cheia e tela ligada */
const rfs=()=>{try{const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;const p=f&&f.call(e,{navigationUI:'hide'});p&&p.catch&&p.catch(()=>{})}catch(e){}};
const xfs=()=>{try{if(document.fullscreenElement||document.webkitFullscreenElement){const p=(document.exitFullscreen||document.webkitExitFullscreen).call(document);p&&p.catch&&p.catch(()=>{})}}catch(e){}};
let wl=null;
const lock=async()=>{try{if('wakeLock' in navigator&&!wl){const l=await navigator.wakeLock.request('screen');wl=l;l.addEventListener('release',()=>{if(wl===l)wl=null})}}catch(e){}};
const unlock=()=>{try{wl&&wl.release()}catch(e){}wl=null};

/* sessão */
let S=null,tm=null;
const imm=$('#imm'),now=()=>Date.now();
const fms=()=>S.acc+(S.st==='focus'?now()-S.seg:0);
const TPL={
  prep:()=>'<div class="big" id="t"></div><p class="hint">Toque ou pressione Espaço para cancelar</p>',
  focus:()=>'<p class="lab">Hiperfoco <b>ativado</b></p><div class="time" id="t"></div><div class="ctl"><button type="button" data-act="pause">Pausar</button><button type="button" data-act="end">Encerrar</button></div>',
  pause:()=>'<p class="sub top">Ao retomar, o bloco recomeça do início.</p><p class="lab">Hiperfoco <b>pausado</b></p><div class="time paused" id="t"></div><div class="ctl keep"><button type="button" class="pill" data-act="resume">Recomeçar bloco</button><button type="button" data-act="end">Encerrar</button></div>',
  check:()=>'<div class="pulse" aria-hidden="true"></div><p class="q">Você ainda está aqui?</p><div class="cnt" id="t"></div><button type="button" class="pill" data-act="ok">Estou aqui</button>',
  break:()=>'<p class="lab">Intervalo</p><div class="time" id="t"></div><div class="ctl"><button type="button" data-act="end">Encerrar</button></div>',
  cfm:()=>'<p class="q">Encerrar o bloco?</p><p class="sub">O tempo focado até aqui fica salvo.</p><div class="duo"><button type="button" class="pill" data-act="keep">Continuar</button><button type="button" class="ghost" data-act="end2">Encerrar</button></div>',
  done:()=>'<p class="lab">Bloco <b>concluído</b></p><div class="time sm" id="t"></div><p class="hint" style="position:static;margin-top:12px">Tempo de presença</p><button type="button" class="pill" data-act="home">Voltar ao início</button>'
};
let ac=null;
const beep=f=>{try{if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.45)}catch(e){}};
const gong=()=>{try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}try{if(!ac)return;const t=ac.currentTime;[196,294,392].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12/(i+1)+.03,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.7)})}catch(e){}};
const alert_=(v,tones)=>{try{navigator.vibrate&&navigator.vibrate(v)}catch(e){}tones.forEach((f,i)=>setTimeout(()=>beep(f),i*230))};
/* chamado de volta: sino suave que insiste em tocar mesmo no silencioso */
const aSess=t=>{try{if(navigator.audioSession)navigator.audioSession.type=t}catch(e){}};
const wav=()=>{
  const sr=22050,n=Math.floor(sr*2.2),h=new DataView(new ArrayBuffer(44+n*2)),w=(o,s)=>{for(let i=0;i<s.length;i++)h.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');h.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');h.setUint32(16,16,true);h.setUint16(20,1,true);h.setUint16(22,1,true);h.setUint32(24,sr,true);h.setUint32(28,sr*2,true);h.setUint16(32,2,true);h.setUint16(34,16,true);w(36,'data');h.setUint32(40,n*2,true);
  const notes=[[392,0],[587.33,.3]],P=2*Math.PI;
  for(let i=0;i<n;i++){
    let v=0;
    for(const[f,o]of notes){const x=i/sr-o;if(x<0)continue;v+=Math.min(1,x/.02)*Math.exp(-x*3.2)*(Math.sin(P*f*x)+.25*Math.exp(-x*3)*Math.sin(P*f*2*x)+.08*Math.exp(-x*5)*Math.sin(P*f*3*x))}
    h.setInt16(44+i*2,Math.max(-1,Math.min(1,v*.4))*32767,true);
  }
  return URL.createObjectURL(new Blob([h.buffer],{type:'audio/wav'}));
};
let ae=null,au=false;
const unlockAudio=()=>{
  aSess('playback');
  try{
    if(!ae){ae=new Audio(wav());ae.preload='auto';ae.volume=.6;ae.setAttribute('playsinline','')}
    if(!au){au=true;ae.muted=true;const p=ae.play();if(p&&p.then)p.then(()=>{ae.pause();ae.currentTime=0;ae.muted=false}).catch(()=>{au=false;ae.muted=false})}
  }catch(e){}
};
const bell=()=>{beep(392);setTimeout(()=>beep(587),300)};
const chime=()=>{
  try{navigator.vibrate&&navigator.vibrate([120,90,120])}catch(e){}
  try{if(ae){ae.muted=false;ae.currentTime=0;const p=ae.play();if(p&&p.catch)p.catch(bell);return}}catch(e){}
  bell();
};
const stopChime=()=>{try{ae&&ae.pause()}catch(e){}};
const persist=()=>{if(!S)return;if(!['focus','pause','check'].includes(S.st)){ls.set('hf_run',null);return}ls.set('hf_run',{cat:S.cat,plan:S.plan,acc:Math.min(fms(),S.plan),pz:S.pz+(S.st==='pause'?now()-S.pAt:0),checks:S.checks,t:S.t,at:now()})};
const record=st=>{
  if(S.rec)return;S.rec=true;
  const sec=Math.round(Math.min(fms(),S.plan)/1000),pz=Math.round((S.pz+(S.st==='pause'?now()-S.pAt:0))/1000);
  if(sec>0)addDay(sec,{s:S.t,f:sec,p:pz,c:S.checks,pl:Math.round(S.plan/1000),cat:S.cat,st});
};
const ui=()=>{
  if(!S)return;
  if(S.cfm&&S.st!==S.cst)S.cfm=false;
  const key=S.cfm?'cfm':S.st;
  if(S.shown!==key){
    S.shown=key;clearTimeout(S.ht);imm.innerHTML=TPL[key]();imm.classList.remove('show');imm.classList.add('on');
    if(['prep','focus','check','break'].includes(S.st))lock();else unlock();persist();
  }
  if(S.st==='focus'&&now()-(S.lp||0)>1000){S.lp=now();persist()}
  const t=$('#t');if(!t)return;
  const n=now();let v='';
  if(S.st==='prep')v=Math.max(1,Math.ceil((S.t0-n)/1000));
  else if(S.st==='focus'||S.st==='pause')v=clk(S.plan-fms());
  else if(S.st==='check')v=Math.max(0,Math.ceil((S.dl-n)/1000));
  else if(S.st==='break')v=clk(S.bEnd-n);
  else v=fmt(Math.round(S.acc/1000));
  const h=String(v).replace(/:/g,'<i class="co">:</i>');if(t.dataset.h!==h){t.dataset.h=h;t.innerHTML=h}
  t.classList.toggle('lg',t.classList.contains('time')&&String(v).length>5);
};
const tick=()=>{
  if(!S)return;const n=now();
  if(S.st==='prep'){if(n>=S.t0){S.st='focus';S.seg=n;S.acc=0;gong()}}
  else if(S.st==='focus'){
    if(fms()>=S.plan)finish();
    else if(cfg.chk&&n-S.seg>=cfg.chkMin*60000){S.acc+=n-S.seg;S.st='check';S.dl=n+10000;S.nc=n+4000;S.checks++;chime()}
  }
  else if(S.st==='check'){if(n>=S.dl){S.st='pause';S.pAt=n}else if(n>=S.nc){S.nc=n+4000;chime()}}
  else if(S.st==='break'){if(n>=S.bEnd){S.st='done';alert_([200],[659,523])}}
  ui();
};
const finish=()=>{S.acc=S.plan;record('completed');alert_([200,100,200],[523,659,784]);if(cfg.brk){S.st='break';S.bEnd=now()+cfg.brkMin*60000}else S.st='done'};
const pauseF=()=>{if(S.st!=='focus')return;S.acc+=now()-S.seg;S.st='pause';S.pAt=now();ui()};
const resumeF=()=>{if(S.st!=='pause')return;unlockAudio();rfs();S.rec=false;record('interrupted');S.rec=false;S.acc=0;S.pz=0;S.checks=0;S.t=new Date().toISOString();S.st='focus';S.seg=now();ui()};
const okF=()=>{if(S.st!=='check')return;stopChime();S.st='focus';S.seg=now();ui()};
const home=()=>{clearInterval(tm);S=null;ls.set('hf_run',null);stopChime();aSess('auto');unlock();xfs();imm.classList.remove('on','show');imm.innerHTML='';$('#home').hidden=false;render()};
const endF=()=>{if(['focus','pause'].includes(S.st)){S.cfm=true;S.cst=S.st;ui();return}home()};
const end2=()=>{if(['focus','pause','check'].includes(S.st))record('cancelled');home()};
const keepF=()=>{S.cfm=false;ui()};
const start=()=>{
  if(S)return;
  S={st:'prep',cat:cfg.cat,t0:now()+5000,plan:cfg.focus*60000,acc:0,pz:0,checks:0,t:new Date().toISOString()};
  $('#home').hidden=true;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume()}catch(e){}unlockAudio();rfs();tm=setInterval(tick,200);ui();
};
$('#go').addEventListener('click',start);
const peek=()=>{clearTimeout(S.ht);const on=imm.classList.toggle('show');if(on)S.ht=setTimeout(()=>imm.classList.remove('show'),4000)};
imm.addEventListener('click',e=>{
  if(!S)return;
  if(S.st==='prep'){home();return}
  const a=e.target.closest('[data-act]');
  if(a){({pause:pauseF,resume:resumeF,end:endF,end2,keep:keepF,ok:okF,home}[a.dataset.act]||(()=>{}))();return}
  if(!S.cfm&&(S.st==='focus'||S.st==='break'))peek();
});
addEventListener('keydown',e=>{
  if(!S||e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;
  if(e.code==='Space'){
    e.preventDefault();document.activeElement&&document.activeElement.blur&&document.activeElement.blur();
    if(S.cfm){keepF();return}
    ({prep:home,focus:pauseF,pause:resumeF,check:okF,done:home}[S.st]||(()=>{}))();
  }else if(e.key==='f'||e.key==='F'){e.preventDefault();rfs()}
  else if(e.key==='Tab'&&(S.st==='focus'||S.st==='break'))imm.classList.add('show');
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&['prep','focus','check','break'].includes(S.st))lock()});
/* relatório diário */
const CATS=[{k:'v',n:'Vendas',c:'#c8f560'},{k:'g',n:'Gestão e desenvolvimento',c:'#7d92c4'},{k:'l',n:'Atividade livre',c:'#b8ad9a'},{k:'x',n:'Sem categoria',c:'#4a4f5c'}];
const catOf=k=>CATS.find(c=>c.k===k)||CATS[3];
const fd=s=>s<60?s+'s':fmt(s);
let rd=0;
const repEl=$('#rep');
const renderRep=()=>{
  const d=new Date();d.setDate(d.getDate()+rd);
  const k=d.toLocaleDateString('sv');
  const all=ls.get('hf_sess',[]).filter(r=>new Date(r.s).toLocaleDateString('sv')===k).sort((a,b)=>a.s<b.s?-1:1);
  const tot=all.reduce((a,r)=>a+r.f,0),n=all.length,pl=all.reduce((a,r)=>a+(r.pl||0),0);
  $('#d-title').textContent=rd===0?'Hoje':rd===-1?'Ontem':d.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});
  $('#d-next').disabled=rd>=0;
  $('#m-foco').textContent=fmt(tot);
  $('#m-blocos').textContent=n;
  $('#m-media').textContent=n?fmt(Math.round(tot/n)):'—';
  $('#m-plan').textContent=n?'de '+fmt(Math.round(pl/n))+' definidos':'';
  const sums={};
  all.forEach(r=>{const c=catOf(r.cat).k;sums[c]=(sums[c]||0)+r.f});
  const rows=CATS.filter(c=>c.k!=='x'||sums.x);
  const bar=$('#bar');
  bar.innerHTML=tot?rows.filter(c=>sums[c.k]).map(c=>'<i style="width:'+(sums[c.k]/tot*100)+'%;background:'+c.c+'"></i>').join(''):'';
  bar.setAttribute('aria-label',rows.filter(c=>sums[c.k]).map(c=>c.n+' '+fmt(sums[c.k])).join(', ')||'Sem dados neste dia');
  $('#dl').innerHTML=rows.map(c=>{const v=sums[c.k]||0;return '<li><i class="dot" style="background:'+c.c+'"></i><span class="n">'+c.n+'</span><span class="t">'+fmt(v)+'</span><span class="p">'+(tot?Math.round(v/tot*100):0)+'%</span></li>'}).join('');
  $('#bl').innerHTML=n?all.map(r=>{const c=catOf(r.cat),t=new Date(r.s).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});return '<li><span class="tm">'+t+'</span><i class="dot" style="background:'+c.c+'"></i><span class="n">'+c.n+'</span><span class="t">'+fd(r.f)+(r.st==='manual'?'<em>manual</em>':r.st!=='completed'?'<em>de '+fmt(r.pl)+'</em>':'')+'</span>'+(r.st==='manual'&&r.id?'<button type="button" class="rm" data-rm="'+r.id+'" aria-label="Remover tempo manual">\u00d7</button>':'')+'</li>'}).join(''):'<li class="empty">Nenhum bloco neste dia.</li>';
};
const openRep=()=>{rd=0;$('#home').hidden=true;repEl.hidden=false;renderRep();scrollTo(0,0)};
const closeRep=()=>{repEl.hidden=true;$('#home').hidden=false;render()};
$('#open-rep').addEventListener('click',openRep);
$('#rep-back').addEventListener('click',closeRep);
$('#d-prev').addEventListener('click',()=>{rd--;renderRep()});
$('#d-next').addEventListener('click',()=>{if(rd<0){rd++;renderRep()}});
/* tempo manual */
const addEl=$('#add'),addOn=()=>addEl.classList.contains('on');
let addOff=0,addFrom=null;
const flash=el=>{el.classList.remove('fl');void el.offsetWidth;el.classList.add('fl')};
const openAdd=off=>{
  if(S)return;
  addOff=off;addFrom=document.activeElement;
  man.mm=30;man.cat=cfg.cat;
  const d=new Date();d.setDate(d.getDate()+off);
  $('#add-d').textContent=off===0?'Hoje':off===-1?'Ontem':d.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});
  render();
  [$('#home'),repEl].forEach(x=>x.inert=true);
  addEl.setAttribute('aria-hidden','false');addEl.classList.add('on');
  addEl.querySelector('.sheet').focus({preventScroll:true});
};
const closeAdd=()=>{
  addEl.classList.remove('on');addEl.setAttribute('aria-hidden','true');
  [$('#home'),repEl].forEach(x=>x.inert=false);
  try{addFrom&&addFrom.isConnected&&addFrom.focus({preventScroll:true})}catch(e){}
};
const addManual=()=>{
  const v=parseInt($('#v-mm').value,10);if(!isNaN(v))man.mm=Math.min(LIM.mm[1],Math.max(LIM.mm[0],v));
  const sec=man.mm*60,d=new Date();d.setDate(d.getDate()+addOff);
  const key=d.toLocaleDateString('sv');
  let st;
  if(addOff===0){st=new Date(now()-sec*1000);const z=new Date();z.setHours(0,0,0,0);if(st<z)st=z}
  else{st=new Date(d);st.setHours(12,0,0,0)}
  addDay(sec,{id:'m'+now().toString(36)+Math.random().toString(36).slice(2,6),s:st.toISOString(),f:sec,p:0,c:0,pl:sec,cat:man.cat,st:'manual'},key);
  addFrom=null;closeAdd();render();
  if(repEl.hidden)flash($('#today'));else{renderRep();flash($('#m-foco'))}
};
const delManual=id=>{
  const a=ls.get('hf_sess',[]),i=a.findIndex(r=>r.id===id);if(i<0)return;
  const r=a[i],k=new Date(r.s).toLocaleDateString('sv'),d=ls.get('hf_days',{});
  d[k]=Math.max(0,(d[k]||0)-r.f);ls.set('hf_days',d);
  a.splice(i,1);ls.set('hf_sess',a);renderRep();render();
};
$('#today').addEventListener('click',()=>openAdd(0));
$('#rep-add').addEventListener('click',()=>openAdd(rd));
$('#add-ok').addEventListener('click',addManual);
$('#add-x').addEventListener('click',closeAdd);
addEl.addEventListener('click',e=>{if(e.target===addEl)closeAdd()});
$('#bl').addEventListener('click',e=>{
  const b=e.target.closest('[data-rm]');if(!b)return;
  if(b.dataset.armed){delManual(b.dataset.rm);return}
  b.dataset.armed='1';b.textContent='Remover?';b.classList.add('arm');
  setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='\u00d7';b.classList.remove('arm')}},3000);
});
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(addOn()){closeAdd();return}if(!repEl.hidden)closeRep()});
addEventListener('pagehide',()=>persist());
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});
try{const r=ls.get('hf_run',null);if(r&&now()-r.at<216e5&&r.acc<r.plan){S={st:'pause',cat:r.cat,plan:r.plan,acc:r.acc,pz:r.pz||0,checks:r.checks||0,t:r.t,pAt:now(),seg:0};$('#home').hidden=true;tm=setInterval(tick,200);ui()}else if(r)ls.set('hf_run',null)}catch(e){}
render();
})();
</script>
